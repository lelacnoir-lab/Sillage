name: Bug report
description: Signaler un problème dans Sillage
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Décris un problème reproductible par ticket. Indique si tu utilises le FM-1 physique, la démo ou l’éditeur USB.
  - type: input
    id: version
    attributes:
      label: Sillage version
      description: Hold HOME > ABOUT on the FM-1
      placeholder: "2.2 bêta"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
