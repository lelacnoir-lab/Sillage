name: Build Sillage FM-1 candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the JieLi toolchain
        run: |
          bash tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          echo "JIELI_TOOLCHAIN=$RUNNER_TEMP/jieli/toolchain" >> "$GITHUB_ENV"
      - name: Fetch the matching external SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79-sdk"
          echo "AC79_SDK=$RUNNER_TEMP/ac79-sdk" >> "$GITHUB_ENV"
      - name: Build and verify V3 candidate
        run: |
          bash recompiler-fm1.sh
          python3 tools/package_v3_release.py --check-build build/felucca.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: Sillage-V3-build-candidate-not-published
          path: build/felucca.fwsc
          if-no-files-found: error
          retention-days: 30
